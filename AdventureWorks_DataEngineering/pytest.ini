[pytest]
# ============================================================
# pytest.ini — AdventureWorks Data Engineering Pipeline
# ============================================================

testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show short summary of test results and extra info
addopts =
    -v
    --tb=short
    --strict-markers

# Custom markers
markers =
    unit: Pure unit tests — no I/O, no DB, no real files
    integration: Integration/smoke tests using mocks
    slow: Tests that take more than 2 seconds (skipped in fast mode)

# Minimum version
minversion = 7.0
